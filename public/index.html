<style>
:root{
  --bg-base:#FFFFFF;--bg-subtle:#F9FAFB;--bg-muted:#F3F4F6;
  --tx-primary:#111827;--tx-secondary:#374151;--tx-muted:#6B7280;--tx-faint:#9CA3AF;
  --bd-default:#E5E7EB;--bd-subtle:#F0F1F3;--bd-strong:#D1D5DB;
  --green:#059669;--green-bg:#ECFDF5;--green-bd:#A7F3D0;
  --red:#DC2626;--red-bg:#FEF2F2;--red-bd:#FECACA;
  --amber:#D97706;--amber-bg:#FFFBEB;--amber-bd:#FDE68A;
  --blue:#2563EB;
  --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono','Fira Code',ui-monospace,monospace;
  --r-sm:4px;--r-md:6px;--r-lg:10px;--r-xl:14px;
  --sh-xs:0 1px 2px rgba(0,0,0,.05);--sh-sm:0 1px 3px rgba(0,0,0,.08);--sh-md:0 4px 6px rgba(0,0,0,.05);
  --max-width:1180px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg-subtle);color:var(--tx-primary);font-family:var(--font-sans);font-size:13px;-webkit-font-smoothing:antialiased}
#root{height:100%;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;color:var(--tx-primary)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd-strong);border-radius:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@keyframes locatePulse{0%,100%{background-color:var(--amber-bg)}50%{background-color:var(--amber-bd)}}
.locate-flash{animation:locatePulse 1.6s ease 2}
.spin{animation:spin .9s linear infinite;display:inline-block}
.blink{animation:blink 1s ease-in-out infinite}
.fade{animation:fade .16s ease}
input[type=range]{accent-color:var(--amber);width:100%;cursor:pointer}
input[type=checkbox]{accent-color:var(--amber);cursor:pointer}
/* Volume control: slider hidden by default, slides in on hover */
.volume-slider-wrap{width:0;overflow:hidden;transition:width .2s ease;}
.volume-ctl:hover .volume-slider-wrap{width:80px;}
/* Progress rail: thickens on hover for easier targeting */
.player-rail{height:4px;background:var(--bg-muted);cursor:pointer;position:relative;transition:height .12s ease;}
.player-rail:hover{height:6px;}
.ti{display:inline-block;width:1em;height:1em;background-color:currentColor;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;vertical-align:-0.125em;flex-shrink:0}
</style>
</head>

</body>
