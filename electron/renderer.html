<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>MusicDedup v2 — P0 技术验证</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 28px 0 10px; }
  .sub { font-size: 12px; opacity: .65; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #6664; padding: 6px 10px; text-align: left; vertical-align: top; }
  th { font-weight: 600; }
  .pass { color: #2da44e; font-weight: 700; }
  .fail { color: #cf222e; font-weight: 700; }
  .detail { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
  audio { width: 100%; margin: 10px 0; }
  .row { display: flex; gap: 12px; align-items: center; margin: 10px 0; }
  button { padding: 6px 14px; cursor: pointer; }
  #status { font-size: 12px; min-height: 16px; }
  .ok { color: #2da44e; } .bad { color: #cf222e; }
</style>
</head>
<body>
  <h1>MusicDedup v2 — P0 技术验证</h1>
  <p class="sub">验证核心依赖在主进程内可用 + 自定义协议流式播放（Electron <span id="ev"></span> / Node <span id="nv"></span>）</p>

  <h2>一、主进程依赖验证</h2>
  <table id="result-table">
    <thead><tr><th style="width:64px">结果</th><th style="width:230px">验证项</th><th>详情</th></tr></thead>
    <tbody></tbody>
  </table>

  <h2>二、自定义协议流式播放（musicdedup://stream/…）</h2>
  <p class="sub">播放器直接指向 musicdedup:// 自定义协议；点击"测试 seek"跳转到中段，若进度位置正确即证明 Range/206 生效。</p>
  <div id="player-area"></div>
  <div class="row">
    <button id="seek-btn" disabled>测试 seek（跳到中段）</button>
    <span id="seek-result"></span>
  </div>
  <p id="status"></p>

<script>
  const $ = (s) => document.querySelector(s);
  const setStatus = (html, cls = '') => { const el = $('#status'); el.innerHTML = html; el.className = cls; };

  async function boot() {
    const [results, samples] = await Promise.all([window.api.verify(), window.api.samples()]);

    const tbody = $('#result-table tbody');
    for (const r of results) {
      const tr = document.createElement('tr');
      const badge = `<span class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}</span>`;
      tr.innerHTML = `<td>${badge}</td><td>${r.label}</td><td class="detail">${r.detail}</td>`;
      tbody.appendChild(tr);
    }
    const passed = results.filter((r) => r.pass).length;
    setStatus(`依赖验证：<b>${passed} / ${results.length}</b> 通过`, passed === results.length ? 'ok' : 'bad');

    const target = samples.find((s) => s.kind === 'FLAC') || samples[0];
    if (!target) { setStatus('没有可用的测试样本（.p0-tmp/samples 为空）', 'bad'); return; }

    // ── 自定义协议播放器 ──
    const src = 'musicdedup://stream/' + encodeURIComponent(target.path);
    const area = $('#player-area');
    area.innerHTML = `<p class="sub">样本：${target.kind} — <span class="detail">${target.path}</span></p>`;

    const audio = document.createElement('audio');
    audio.controls = true;
    audio.src = src;
    area.appendChild(audio);

    const res = $('#seek-result');
    let reported = false;
    const report = (pass, detail) => {
      if (reported) return;
      reported = true;
      window.api.streamResult({ pass, detail });
    };

    // 自动自测：loadedmetadata 后验证 duration 有限（= Range 生效）→ 跳中段 → 验证 seek 位置
    audio.addEventListener('loadedmetadata', () => {
      const dur = audio.duration;
      const seekable = Number.isFinite(dur) && dur > 0;
      $('#seek-btn').disabled = !seekable;
      if (!seekable) {
        res.textContent = `⚠️ duration=${dur}，不可 seek`;
        res.className = 'bad';
        report(false, `duration=${dur}（非有限值），Range 未生效`);
        return;
      }
      res.textContent = `✅ 可 seek（duration=${dur.toFixed(1)}s）—— 206/Range 生效`;
      res.className = 'ok';
      const targetTime = dur / 2;
      audio.currentTime = targetTime;
      audio.addEventListener('seeked', () => {
        const got = audio.currentTime;
        const ok = Math.abs(got - targetTime) < 0.5;
        res.textContent = ok ? `✅ seek 成功（目标 ${targetTime.toFixed(1)}s，实际 ${got.toFixed(1)}s）` : `❌ seek 失败（目标 ${targetTime.toFixed(1)}s，实际 ${got.toFixed(1)}s）`;
        res.className = ok ? 'ok' : 'bad';
        report(ok, `duration=${dur.toFixed(1)}s 可 seek；跳转中段成功=${ok}`);
      }, { once: true });
      // 尝试实际出声（Electron 已放开自动播放；失败不阻塞 seek 结论）
      audio.play().catch(() => {});
    });
    audio.addEventListener('error', () => {
      const msg = audio.error ? audio.error.message : '未知错误';
      setStatus(`❌ 音频加载失败：${msg}`, 'bad');
      res.textContent = '❌ 加载失败';
      res.className = 'bad';
      report(false, `加载失败：${msg}`);
    });

    // 手动按钮：允许人工重复触发 seek 测试
    $('#seek-btn').addEventListener('click', () => {
      const targetTime = audio.duration / 2;
      audio.currentTime = targetTime;
      audio.addEventListener('seeked', () => {
        const got = audio.currentTime;
        const ok = Math.abs(got - targetTime) < 0.5;
        res.textContent = ok ? `✅ 跳到中段成功（目标 ${targetTime.toFixed(1)}s，实际 ${got.toFixed(1)}s）` : `❌ seek 失败（目标 ${targetTime.toFixed(1)}s，实际 ${got.toFixed(1)}s）`;
        res.className = ok ? 'ok' : 'bad';
      }, { once: true });
    });
  }

  document.getElementById('ev').textContent = (window.process && window.process.versions && window.process.versions.electron) || '-';
  document.getElementById('nv').textContent = (window.process && window.process.versions && window.process.versions.node) || '-';
  boot().catch((e) => setStatus('初始化失败：' + e.message, 'bad'));
</script>
</body>
</html>
